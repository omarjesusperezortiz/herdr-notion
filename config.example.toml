# herdr-notion configuration.
#
#   mkdir -p "$(herdr plugin config-dir herdr-notion)"
#   cp config.example.toml "$(herdr plugin config-dir herdr-notion)/config.toml"
#
# The running pane reloads the config on `R`.

[notion]
# Written by the first-run setup, which also signs you in with the browser.
# The data source id is the `collection://` id of the database.
data_source_id = "00000000-0000-0000-0000-000000000000"
status_property = "Status"
columns = ["Status", "Priority", "Assignee"]

# Optional. Name of the title property when it is not detected.
# title_property = "Name"

page_size = 50
# Clicks and the mouse wheel (M toggles it while running). Off by default: it stops text selection by dragging.
# mouse = true

# Named filter tabs, switched with `f` or 1-9. The first one opens. `filter` is a
# Notion filter object (https://developers.notion.com/reference/filter-data-source-entries);
# `people = { contains = "me" }` means "assigned to the signed-in user".
# The setup writes the ones your database supports; `S` -> "Reset the filter tabs" redoes it.

[[filters]]
name = "Mine"
filter = { and = [
  { property = "Assignee", people = { contains = "me" } },
  { property = "Status", status = { does_not_equal = "Done" } },
] }

[[filters]]
name = "Current sprint"
filter = { property = "Current sprint?", formula = { checkbox = { equals = true } } }

[[filters]]
name = "All"

[delegate]
# Prompt sent to the agent you pick with `d`. Placeholders:
#   {title} {url} {id} {status} {properties} {body}
prompt = """
You are asked to work on this Notion page: {title}
Link: {url}
Status: {status}

Properties:
{properties}

Content:
{body}

Please do the work it describes and summarize what you changed when done.
"""
max_body_chars = 6000
# default_cwd = "~/projects"

# Start-new-agent wait: after `startup_delay_ms`, wait up to `wait_ready_ms`
# for the agent to be detected and idle before sending the prompt.
startup_delay_ms = 1500
wait_ready_ms = 30000

# Agents offered by "+ start new agent..." (name, argv).
[[delegate.agents]]
name = "claude"
command = ["claude"]

[[delegate.agents]]
name = "codex"
command = ["codex"]
